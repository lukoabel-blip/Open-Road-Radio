<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Road Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a car-radio faceplate. Tuner band on top, big station readout, presets, transport. One dark dashboard world. */
:root{
  color-scheme:dark;
  --ink:#0e1a20; --panel:#16272f; --panel2:#1d333d; --line:#2b4550;
  --text:#ece6d6; --mute:#8fa5ab; --amber:#ffb23e; --bad:#ff6b5e;
  --st:#5fd0c5;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4}
body{padding-bottom:84px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.mark{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:17px}
.mark span{color:var(--amber)}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:4px 9px;border:1px solid var(--line);border-radius:99px;color:var(--mute);display:flex;gap:6px;align-items:center}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.pill.on{color:var(--text);border-color:var(--bad)} .pill.on i{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.view{display:none}.view.show{display:block}

/* Tuner */
.tuner{background:linear-gradient(#1a2e37,#13232a);border:1px solid var(--line);border-radius:10px;padding:10px 12px 6px;position:relative}
.band{position:relative;height:46px}
.ticks{position:absolute;left:0;right:0;top:6px;height:16px;background:repeating-linear-gradient(90deg,var(--mute) 0 1px,transparent 1px calc(100%/44));opacity:.45}
.ticks.major{height:24px;top:2px;background:repeating-linear-gradient(90deg,var(--text) 0 1px,transparent 1px calc(100%/11));opacity:.5}
.nums{position:absolute;left:0;right:0;bottom:0;font-family:var(--mono);font-size:10px;color:var(--mute)}
.nums span{position:absolute;transform:translateX(-50%)}
.pip{position:absolute;top:-4px;width:30px;height:36px;margin-left:-15px;background:none;border:0;padding:0}
.pip::after{content:"";position:absolute;left:11px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.85}
.pip.cur::after{box-shadow:0 0 10px var(--c);opacity:1}
.needle{position:absolute;top:-6px;bottom:8px;width:2px;margin-left:-1px;background:var(--amber);box-shadow:0 0 10px var(--amber);transition:left .5s cubic-bezier(.3,1.3,.5,1)}
@media (prefers-reduced-motion:reduce){.needle{transition:none}}
.readout{padding:18px 2px 6px}
.freq{font-family:var(--mono);color:var(--amber);font-size:14px;letter-spacing:.08em}
.stname{font-family:var(--display);font-weight:800;font-size:clamp(46px,15vw,72px);line-height:.92;text-transform:uppercase;color:var(--st);margin:4px 0 6px;text-wrap:balance;overflow-wrap:anywhere}
.tag{color:var(--mute);font-size:15px}

.presets{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.preset{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px 8px;text-align:left;min-width:86px}
.preset b{display:block;font-family:var(--mono);font-weight:500;font-size:10px;color:var(--mute)}
.preset span{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.preset.cur{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}

.now{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--st);border-radius:10px;padding:14px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.title{font-size:21px;font-weight:600;margin-top:6px;overflow-wrap:anywhere}
.artist{color:var(--mute);overflow-wrap:anywhere}
.djline{font-size:18px;font-style:italic;margin-top:6px}
.bar{height:4px;background:var(--panel2);border-radius:2px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--st)}
.times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:4px;font-variant-numeric:tabular-nums}
.fav{background:none;border:0;padding:0 2px;font-size:18px;color:var(--mute);line-height:1}
.fav.on{color:var(--amber)}

.transport{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 8px}
.tb{background:var(--panel);border:1px solid var(--line);border-radius:10px;height:54px;flex:1;display:grid;place-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mute)}
.tb svg{width:22px;height:22px;fill:var(--text)}
.tb.big{flex:1.5;height:66px;background:var(--st);border-color:var(--st)}
.tb.big svg{width:30px;height:30px;fill:var(--ink)}
.tb:active{transform:translateY(1px)}
.vol{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--mute);margin:6px 0}
.vol input{flex:1;accent-color:var(--amber)}
.note{font-size:14px;color:var(--mute);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-top:12px}
.note.err{border-color:var(--bad);color:var(--text)}
h2{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.04em;text-transform:uppercase;margin:18px 0 8px}
h3{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;text-align:left}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.row.dim{opacity:.5}
.tagk{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:2px 5px;white-space:nowrap}
.dots{display:flex;gap:3px;flex-wrap:wrap;max-width:44px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-weight:500;min-height:44px}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:600}
.btn.sm{min-height:34px;padding:5px 10px;font-size:14px}
.btn.danger{color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);flex:1;min-width:130px}
.field input,.field select,input.search{background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 10px;color:var(--text);min-height:40px;width:100%}
.fields{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.stcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px}
.stcard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stcard .nm{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;color:var(--c)}
.stcard .meta{font-family:var(--mono);font-size:11px;color:var(--mute)}
.nfc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center}
.nfc .chip{width:44px;height:58px;border-radius:6px;background:var(--c);flex:0 0 auto;display:grid;place-items:center;font-family:var(--mono);font-size:9px;color:var(--ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#0b151a;border-top:1px solid var(--line);z-index:5}
nav.tabs div{max-width:520px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:14px 2px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);border-top:2px solid transparent}
nav.tabs button.cur{color:var(--amber);border-top-color:var(--amber)}
#sheet{position:fixed;inset:0;background:rgba(5,10,13,.7);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#sheet .card{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:18px 16px 24px;width:100%;max-width:520px;max-height:85%;overflow:auto}
#sheet h2{margin-top:0}
.chk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.chk input{width:20px;height:20px;accent-color:var(--amber)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--ink);padding:9px 14px;border-radius:8px;font-size:14px;font-weight:500;z-index:20;max-width:90%;text-align:center}
#toast[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark">OPEN ROAD <span>RADIO</span></div>
    <div class="pill" id="air"><i></i><span id="airtxt">STANDBY</span></div>
  </header>

  <section class="view show" id="v-radio">
    <div class="tuner"><div class="band" id="band"></div></div>
    <div class="readout">
      <div class="freq" id="freq"></div>
      <div class="stname" id="stname"></div>
      <div class="tag" id="sttag"></div>
    </div>
    <div class="presets" id="presets"></div>
    <div class="now" id="now"></div>
    <div class="transport">
      <button class="tb" data-act="stprev" aria-label="Previous station"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7z"/></svg>STN</button>
      <button class="tb" data-act="prev" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="tb big" data-act="toggle" id="playbtn" aria-label="Play or pause"></button>
      <button class="tb" data-act="next" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <button class="tb" data-act="stnext" aria-label="Next station"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7z"/></svg>STN</button>
    </div>
    <label class="vol" id="volrow" for="vol">VOL <input type="range" id="vol" min="0" max="1" step="0.02"></label>
    <div id="radionote"></div>
    <h3>Coming up</h3>
    <div class="list" id="upnext"></div>
  </section>

  <section class="view" id="v-library"></section>
  <section class="view" id="v-stations"></section>
  <section class="view" id="v-cards"></section>
  <section class="view" id="v-log"></section>
</div>

<nav class="tabs"><div>
  <button data-tab="radio" class="cur">Radio</button>
  <button data-tab="library">Music</button>
  <button data-tab="stations">Stations</button>
  <button data-tab="cards">Cards</button>
  <button data-tab="log">Log</button>
</div></nav>

<div id="sheet" hidden><div class="card" id="sheetbody"></div></div>
<div id="toast" hidden role="status"></div>
<audio id="au" preload="auto" playsinline></audio>
<input type="file" id="file" accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg" multiple hidden>

<script id="engine">
/* ===== Open Road Radio engine: pure logic, no DOM. Tested in Node. ===== */
(function(root){
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
const norm=s=>(s||'').trim().toLowerCase();
function inStation(st,t){
  if(st.all)return true;
  if(t.stations&&t.stations.length)return t.stations.includes(st.id);
  const g=norm(t.genre); if(!g)return true;            // unsorted tracks play everywhere
  return (st.genres||[]).some(k=>g.includes(k));
}
function poolFor(st,tracks){return tracks.filter(t=>t.available!==false&&inStation(st,t))}

/* Choose the next track. Tries strict repetition rules first, then relaxes step by step so playback never stops. */
function pickTrack(st,pool,recent,now,rand){
  if(!pool.length)return null;
  const lastT=new Map(),lastA=new Map();
  const sorted=recent.slice().sort((a,b)=>b.at-a.at);
  for(const r of sorted){ if(!lastT.has(r.trackId))lastT.set(r.trackId,r.at); const a=norm(r.artist); if(a&&!lastA.has(a))lastA.set(a,r.at); }
  const order=[...lastT.keys()];
  const R=st.rules||{},M=60000,tw=(R.track_repeat_minutes||240)*M,aw=(R.artist_repeat_minutes||45)*M;
  const ok=(t,tWin,aWin)=>{
    const lt=lastT.get(t.id); if(lt!==undefined&&now-lt<tWin)return false;
    const a=norm(t.artist),la=a?lastA.get(a):undefined; if(aWin&&la!==undefined&&now-la<aWin)return false;
    return true};
  const levels=[
    t=>ok(t,tw,aw), t=>ok(t,tw/2,aw/2), t=>ok(t,tw/4,0),
    t=>!order.slice(0,Math.max(1,Math.floor(pool.length/2))).includes(t.id),
    t=>t.id!==order[0], ()=>true];
  let elig=[],level=0;
  for(;level<levels.length;level++){elig=pool.filter(levels[level]);if(elig.length)break}
  const d=st.discovery||'balanced';
  const w=elig.map(t=>{
    const p=t.plays||0,lt=lastT.get(t.id);
    const stale=lt===undefined?2:1+Math.min((now-lt)/3600000,24)/24;
    let base=1;
    if(d==='familiar')base=1+Math.min(p,8)*0.5+(t.fav?3:0);
    else if(d==='explorer')base=3/(1+p);
    else base=1+(t.fav?1:0);
    return base*stale});
  let x=rand()*w.reduce((a,b)=>a+b,0),i=0;
  for(;i<w.length-1;i++){x-=w[i];if(x<=0)break}
  return {track:elig[i],relaxed:level};
}

const DJ_PRESETS={off:null,rare:{id:[5,8],talk:[12,18]},normal:{id:[3,6],talk:[8,12]},chatty:{id:[2,3],talk:[4,6]}};
const ri=(rand,[a,b])=>a+Math.floor(rand()*(b-a+1));
function newProg(st,rand){const p=DJ_PRESETS[st.dj||'normal'];return p?{sinceId:0,sinceTalk:0,idAt:ri(rand,p.id),talkAt:ri(rand,p.talk)}:{off:true}}
/* Call once per programmed song. Returns 'talk', 'ident' or null for what should follow that song. */
function djDue(prog,st,rand){
  const p=DJ_PRESETS[st.dj||'normal']; if(!p||prog.off)return null;
  prog.sinceId++;prog.sinceTalk++;
  if(prog.sinceTalk>=prog.talkAt){prog.sinceTalk=0;prog.sinceId=0;prog.talkAt=ri(rand,p.talk);prog.idAt=ri(rand,p.id);return 'talk'}
  if(prog.sinceId>=prog.idAt){if(prog.talkAt-prog.sinceTalk<=1)return null; /* a longer break is close; let it carry the ID */ prog.sinceId=0;prog.idAt=ri(rand,p.id);return 'ident'}
  return null}
/* Pick a line index, avoiding the most recently used half of the pool. */
function pickScript(n,recentIdx,rand){
  if(n<=0)return -1;
  const avoid=recentIdx.slice(-Math.floor(n/2));
  const c=[];for(let i=0;i<n;i++)if(!avoid.includes(i))c.push(i);
  return c[Math.floor(rand()*c.length)]}

/* Built-in demo signal so the radio works before any music is added. Returns a WAV ArrayBuffer. */
function synthDemo(seed,secs){
  const r=rng(seed),sr=22050,bpm=80+Math.floor(r()*56),beat=60/bpm;
  const bars=Math.max(4,Math.round((secs||20)/(beat*4))),n=Math.floor(bars*4*beat*sr),out=new Float32Array(n);
  const root=98*Math.pow(2,Math.floor(r()*10)/12);
  const prog=[[0,5,7,5],[0,-3,5,7],[0,7,-3,5]][Math.floor(r()*3)],arp=[0,4,7,12,16,12,7,4];
  const off=Math.floor(r()*8),step=1+Math.floor(r()*3);
  function note(f,start,len,amp,decay){const s0=Math.floor(start*sr),s1=Math.min(n,s0+Math.floor(len*sr));
    for(let i=s0;i<s1;i++){const t=(i-s0)/sr,env=Math.exp(-decay*t)*Math.min(1,t*300);out[i]+=amp*env*(Math.sin(6.2832*f*t)+0.3*Math.sin(12.5664*f*t))}}
  for(let b=0;b<bars;b++){const f=root*Math.pow(2,prog[b%4]/12),t0=b*4*beat;
    note(f,t0,beat*2,0.32,1.5);note(f,t0+beat*2,beat*2,0.26,1.5);
    for(let e=0;e<8;e++)note(f*2*Math.pow(2,arp[(off+e*step)%8]/12),t0+e*beat/2,beat*0.9,0.16,5)}
  const fade=Math.floor(1.5*sr);
  const buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){let s=out[i];if(i>n-fade)s*=(n-i)/fade;s=Math.max(-1,Math.min(1,s*0.9));v.setInt16(44+i*2,s*32767,true)}
  return buf}

/* Minimal ID3v2 reader: title, artist, genre. Returns {} when there is no tag. */
function readId3(buf){
  const b=new Uint8Array(buf),o={};
  if(b.length<10||b[0]!==0x49||b[1]!==0x44||b[2]!==0x33)return o;
  const ver=b[3],ss=(i)=>(b[i]&127)<<21|(b[i+1]&127)<<14|(b[i+2]&127)<<7|(b[i+3]&127);
  const end=Math.min(b.length,10+ss(6));let p=10;
  const dec=(bytes)=>{if(!bytes.length)return '';const e=bytes[0],d=bytes.subarray(1);
    const enc=e===1?'utf-16':e===2?'utf-16be':e===3?'utf-8':'iso-8859-1';
    try{return new TextDecoder(enc).decode(d).replace(/\0+$/,'').split('\0')[0].trim()}catch(x){return ''}};
  const map=ver===2?{TT2:'title',TP1:'artist',TCO:'genre'}:{TIT2:'title',TPE1:'artist',TCON:'genre'};
  while(p+(ver===2?6:10)<=end){
    let id,size,hs;
    if(ver===2){id=String.fromCharCode(b[p],b[p+1],b[p+2]);size=b[p+3]<<16|b[p+4]<<8|b[p+5];hs=6}
    else{id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);size=ver===4?ss(p+4):(b[p+4]<<24|b[p+5]<<16|b[p+6]<<8|b[p+7])>>>0;hs=10}
    if(!/^[A-Z0-9]+$/.test(id)||size<=0)break;
    if(map[id]&&p+hs+size<=b.length)o[map[id]]=dec(b.subarray(p+hs,p+hs+size));
    p+=hs+size}
  if(o.genre&&/^\(?\d+\)?$/.test(o.genre))o.genre='';
  return o}

const api={rng,inStation,poolFor,pickTrack,newProg,djDue,pickScript,synthDemo,readId3,DJ_PRESETS};
if(typeof module!=='undefined'&&module.exports)module.exports=api; else root.ORR=api;
})(typeof window!=='undefined'?window:globalThis);
</script>

<script id="data">
/* ===== Station and DJ definitions. Everything here is data; the app has no station-specific code. ===== */
const PERSONAS={
 wave:{label:'Easygoing',name:'Marlo',rate:0.95,pitch:1.0,prefer:['Samantha', 'Ava', 'Allison', 'Susan', 'Google US English'],voice:0,lines:{
  intro:["This is {st}. Windows down, no rush. Let's ease into it.","{st}, coming in soft. Stay as long as you like.","You found {st}. Good timing, we were just getting comfortable."],
  ident:["{st}.","You're on {st}, where nobody's in a hurry.","{st}. Still here, still easy.","This is {st}. Breathe out.","{st}, the slow lane of the dial."],

function unlock(){
  if(unlocked)return;unlocked=true;
  try{const A=window.AudioContext||window.webkitAudioContext;if(A){actx=new A();actx.resume&&actx.resume()}}catch(e){}
  try{if(window.speechSynthesis&&S.settings.voice){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}
  try{const su=URL.createObjectURL(new Blob([ORR.synthDemo(1,0.1).slice(0,44+2200)],{type:'audio/wav'}));djAu.src=su;const pr=djAu.play();pr&&pr.catch(()=>{})}catch(e){}
  if(spMode()){try{actx&&actx.suspend()}catch(e){}return}
  try{silentUrl=URL.createObjectURL(new Blob([ORR.synthDemo(1,0.1).slice(0,44+2200)],{type:'audio/wav'}));au.dataset.tid='';au.src=silentUrl;const pr=au.play();pr&&pr.catch(()=>{})}catch(e){}
}
function fade(){return new Promise(r=>{if(au.paused)return r();const v0=au.volume;let i=0;const h=setInterval(()=>{i++;try{au.volume=v0*(1-i/6)}catch(e){}if(i>=6){clearInterval(h);au.pause();try{au.volume=v0}catch(e){}r()}},30)})}
function settle(){ // book-keeping for the track that is ending or being skipped
  if(spMode())return;
  if(!nowItem||nowItem.type!=='music')return;
  const t=trackById(nowItem.trackId);if(!t)return;
  const heard=au.currentTime||0,dur=au.duration||0;
  if(au.ended||heard>=30||(dur&&heard>=dur*0.8)){t.plays=(t.plays||0)+1}else log('skip',`Skipped ${t.title}`);
  save()}
async function advance(){
  const my=++token;errMsg='';djText='';
  refill();
  const item=queue.shift();
  if(!item){stopWith(demoMode()?'Nothing to play.':`${cur().name} has no playable tracks. Add music or assign tracks to it in Music.`);return}
  refill();nowItem=item;render();
  if(item.type==='dj'){await playDj(item,my);if(my!==token)return;djText='';return advance()}
  const t=trackById(item.trackId);let url=null;
  try{url=t&&await urlFor(t)}catch(e){}
  if(my!==token)return;
  if(!url){trackFailed(t,'file is not on this device');return}
  au.dataset.tid=t.id;au.src=url;try{au.volume=S.settings.volume}catch(e){}
  S.recent.push({trackId:t.id,artist:t.artist,at:Date.now()});if(S.recent.length>300)S.recent.splice(0,S.recent.length-300);
  t.lastPlayed=Date.now();
  log('music',`${t.title}${t.artist?' · '+t.artist:''}`+(item.relaxed>1?' (repeat rules relaxed)':''));
  mediaMeta(t);render();
  const pr=au.play();pr&&pr.catch(e=>{if(e&&e.name==='AbortError')return;if(my===token){on=false;errMsg='Your browser paused playback. Tap play to continue.';render()}})
}
function trackFailed(t,why){
  if(t){if(!t.demo)t.available=false;log('error',`Could not play ${t.title}: ${why}`)}
  fails++;queue=queue.filter(q=>!(q.type==='music'&&t&&q.trackId===t.id));
  if(fails>=5||!ORR.poolFor(cur(),library()).length){stopWith(`${cur().name} has no playable tracks right now. Re-add the files in Music.`);return}
  advance()}
function stopWith(msg){on=false;nowItem=null;errMsg=msg;token++;au.pause();log('error',msg);render()}
function toggle(){
  unlock();
  if(spMode())return spToggle();
  if(!on){on=true;errMsg='';
    if(nowItem&&nowItem.type==='music'&&au.dataset.tid===nowItem.trackId&&!au.ended){const pr=au.play();pr&&pr.catch(()=>{});render()}
    else{if(!prog)startStation(true);advance()}}
  else{on=false;if(nowItem&&nowItem.type==='music')au.pause();else{token++;cancelSpeech();nowItem=null;djText=''}render()}}
function startStation(withIntro){const st=cur();prog=ORR.newProg(st,rand);queue=withIntro?[{type:'dj',kind:'intro'}]:[]}
async function tune(id,why){
  unlock();
  const st=station(id);if(!st||!st.enabled){toast('That station is not available.');return}
  if(id===curId&&on){toast(`Already on ${st.name}`);return}
  settle();token++;cancelSpeech();
  curId=id;S.settings.last=id;save();
  if(why)log('card',why,id);
  if(spMode()){render();return spStart(true)}
  if(!ORR.poolFor(st,library()).length){await fade();nowItem=null;render();stopWith(`${st.name} has no tracks yet. Open Music and assign some to it.`);return}
  startStation(true);on=true;nowItem=null;render();
  await fade();advance()}
async function next(){unlock();if(spMode())return spNext();if(!prog)startStation(false);settle();if(nowItem&&nowItem.type==='music')prevStack.push(nowItem.trackId);token++;cancelSpeech();on=true;await fade();advance()}
async function prev(){unlock();if(spMode())return spPrev();
  if(nowItem&&nowItem.type==='music'&&au.currentTime>4){au.currentTime=0;return}
  const id=prevStack.pop();if(!id){if(nowItem&&nowItem.type==='music')au.currentTime=0;return}
  if(!prog)startStation(false);
  settle();token++;cancelSpeech();if(nowItem&&nowItem.type==='music')queue.unshift(nowItem);queue.unshift({type:'music',trackId:id});on=true;await fade();advance()}
function stepStation(d){const l=live();if(!l.length)return;const i=l.findIndex(s=>s.id===curId);tune(l[(i+d+l.length)%l.length].id)}

au.addEventListener('ended',()=>{if(nowItem&&nowItem.type==='music'&&au.dataset.tid===nowItem.trackId){settle();prevStack.push(nowItem.trackId);if(prevStack.length>50)prevStack.shift();advance()}});
au.addEventListener('error',()=>{if(nowItem&&nowItem.type==='music'&&au.dataset.tid===nowItem.trackId&&on)trackFailed(trackById(nowItem.trackId),'the file would not decode')});
au.addEventListener('playing',()=>{if(au.dataset.tid)fails=0});
au.addEventListener('timeupdate',renderProgress);
au.addEventListener('pause',()=>{ // paused from the lock screen or headphones
  if(on&&nowItem&&nowItem.type==='music'&&au.dataset.tid===nowItem.trackId&&!au.ended&&document.visibilityState!=='hidden'){/* handled by our own controls */}});
function mediaMeta(t){try{if(!('mediaSession' in navigator))return;const st=cur();
  navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist||st.name,album:st.name+' · Open Road Radio'});
  navigator.mediaSession.setActionHandler('play',()=>{if(!on)toggle()});
  navigator.mediaSession.setActionHandler('pause',()=>{if(on)toggle()});
  navigator.mediaSession.setActionHandler('nexttrack',next);
  navigator.mediaSession.setActionHandler('previoustrack',prev)}catch(e){}}

const SP_SCOPES='streaming user-read-email user-read-private playlist-modify-private playlist-modify-public playlist-read-private playlist-read-collaborative user-library-read user-read-playback-state user-modify-playback-state user-read-currently-playing';
const SP_ASLEEP='Spotify is asleep. Open the Spotify app, play any song for a moment, then come back here and press play.';
const spRedirect=()=>location.origin+location.pathname;
const spCanRun=()=>{try{return location.protocol==='https:'&&window.self===window.top}catch(e){return false}};
const spMode=()=>S.settings.source==='spotify'&&!!S.sp.refresh;
let SPT=[];try{SPT=JSON.parse(localStorage.getItem(KEY+'.sp')||'[]')}catch(e){}
function saveSp(){try{localStorage.setItem(KEY+'.sp',JSON.stringify(SPT))}catch(e){}}
let spBatch=[],spIdx=-1,spPollT=0,spEdgeT=0,spEdgeFor='',spState={prog:0,dur:0,at:0,playing:false},spBusy=false,spExt=null,spStale=false,spCmdAt=0,djNext=null;
const spNow=()=>Math.min(spState.dur||1e12,spState.prog+(spState.playing?Date.now()-spState.at:0));
function spRand(n){const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';return Array.from(crypto.getRandomValues(new Uint8Array(n)),x=>c[x%c.length]).join('')}
async function spLogin(){
  try{const v=spRand(64),state=spRand(16),dig=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
    const ch=btoa(String.fromCharCode(...new Uint8Array(dig))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
    localStorage.setItem('orr.pkce',JSON.stringify({v,state}));
    location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({response_type:'code',client_id:S.sp.clientId,scope:SP_SCOPES,redirect_uri:spRedirect(),state,code_challenge_method:'S256',code_challenge:ch})}
  catch(e){toast('This browser could not start Spotify sign-in.')}}
async function spToken(params){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(params)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error_description||j.error||('Spotify sign-in failed ('+r.status+')'));e.auth=true;throw e}
  S.sp.token=j.access_token;if(j.refresh_token)S.sp.refresh=j.refresh_token;S.sp.exp=Date.now()+(j.expires_in||3600)*1000;save()}
async function spCallback(){
  const q=new URLSearchParams(location.search);if(!q.get('code')&&!q.get('error'))return;
  let pk={};try{pk=JSON.parse(localStorage.getItem('orr.pkce')||'{}')}catch(e){}
  try{history.replaceState(null,'',spRedirect())}catch(e){}
  if(q.get('error')||q.get('state')!==pk.state){toast('Spotify sign-in was cancelled.');return}
  try{await spToken({grant_type:'authorization_code',code:q.get('code'),redirect_uri:spRedirect(),client_id:S.sp.clientId,code_verifier:pk.v});
    S.settings.source='spotify';save();showTab('library');toast('Spotify connected');spLoadPlaylists()}
  catch(e){showTab('library');toast(e.message)}}
async function sp(method,path,body,retry){
  if(Date.now()>S.sp.exp-60000)await spToken({grant_type:'refresh_token',refresh_token:S.sp.refresh,client_id:S.sp.clientId});
  const r=await fetch('https://api.spotify.com/v1'+path,{method,headers:Object.assign({Authorization:'Bearer '+S.sp.token},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
  if(r.status===401&&!retry){S.sp.exp=0;return sp(method,path,body,true)}
  if(r.status===429&&!retry){await new Promise(z=>setTimeout(z,Math.min(5,+(r.headers.get('Retry-After')||1))*1000));return sp(method,path,body,true)}
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok){const e=new Error((j&&j.error&&j.error.message)||('Spotify error '+r.status));e.status=r.status;e.reason=j&&j.error&&j.error.reason;throw e}
  return j}
function spMsg(e){
  if(e.sdk)return e.message;
  if(e.auth)return 'Spotify signed you out. Open Music and connect again.';
  if(e.status===404||e.reason==='NO_ACTIVE_DEVICE'){if(S.sp.inpage){spDevId=null;return 'The in-page Spotify player lost its connection. Press play to reconnect.'}return SP_ASLEEP}
  if(e.status===403)return 'Spotify refused that command ('+e.message+'). Playback control needs Spotify Premium on the signed-in account.';
  if(e.status===429)return 'Spotify asked the radio to slow down. Wait a minute and press play.';
  return 'Spotify: '+e.message}
function spFail(msg){on=false;errMsg=msg;log('error',msg);render()}
const spPath=u=>u?u.replace('https://api.spotify.com/v1',''):null;


/* in-page playback: Spotify's Web Playback SDK turns this page into the Spotify device */
let spPlayer=null,spDevId=null,spSdkErr='',spSdkLoading=null,spReadyWait=[];
function spGesture(){try{if(S.sp.inpage&&spPlayer&&spPlayer.activateElement){const p=spPlayer.activateElement();p&&p.catch&&p.catch(()=>{})}}catch(e){}}
function spLoadSdk(){
  if(window.Spotify&&window.Spotify.Player)return Promise.resolve();
  if(spSdkLoading)return spSdkLoading;
  return spSdkLoading=new Promise((res,rej)=>{
    window.onSpotifyWebPlaybackSDKReady=()=>res();
    const sc=document.createElement('script');sc.src='https://sdk.scdn.co/spotify-player.js';sc.async=true;
    sc.onerror=()=>{spSdkLoading=null;rej(new Error('load'))};document.head.appendChild(sc);
    setTimeout(()=>{if(!(window.Spotify&&window.Spotify.Player)){spSdkLoading=null;rej(new Error('timeout'))}},15000)})}
async function spInitPlayer(){
  if(spPlayer||!spCanRun())return;
  spSdkErr='';
  try{await spLoadSdk()}catch(e){spSdkErr='Spotify\'s in-page player could not load. Check your connection or any content blocker, or switch to The Spotify app.';render();return}
  if(spPlayer)return;
  const P=new window.Spotify.Player({name:'Open Road Radio',volume:S.settings.volume,enableMediaSession:true,
    getOAuthToken:cb=>{(Date.now()>S.sp.exp-60000?spToken({grant_type:'refresh_token',refresh_token:S.sp.refresh,client_id:S.sp.clientId}):Promise.resolve()).then(()=>cb(S.sp.token),()=>cb(S.sp.token))}});
  spPlayer=P;
  const bad=(m)=>{spSdkErr=m;spReadyWait.splice(0).forEach(w=>w(null));if(on&&spMode()&&S.sp.inpage)spFail(m);else render()};
  P.addListener('ready',({device_id})=>{spDevId=device_id;spSdkErr='';spReadyWait.splice(0).forEach(w=>w(device_id));render()});
  P.addListener('not_ready',()=>{spDevId=null;render()});
  P.addListener('initialization_error',()=>bad('This browser cannot play Spotify inside a page. In Music, switch to The Spotify app.'));
  P.addListener('authentication_error',()=>bad('Spotify would not sign the in-page player in. In Music, disconnect and connect again so it can grant playback.'));
  P.addListener('account_error',()=>bad('In-page playback needs a full Spotify Premium plan on the signed-in account.'));
  P.addListener('playback_error',({message})=>{log('error','Spotify playback: '+message)});
  P.addListener('autoplay_failed',()=>{if(on&&spMode())spFail('Safari blocked the song from starting by itself. Press play.')});
  try{const ok=await P.connect();if(!ok)bad('The in-page Spotify player could not connect. Press play to try again.')}catch(e){bad('The in-page Spotify player could not connect.')}}
function spKillPlayer(){try{spPlayer&&spPlayer.disconnect()}catch(e){}spPlayer=null;spDevId=null;spSdkErr=''}
async function spPlayerId(){
  if(spDevId)return spDevId;
  if(spSdkErr&&spPlayer){spKillPlayer()}
  spInitPlayer();
  const id=await new Promise(res=>{spReadyWait.push(res);setTimeout(()=>res(null),15000)});
  if(!id){const e=new Error(spSdkErr||'The in-page Spotify player did not come online. Check your connection and press play, or switch to The Spotify app in Music.');e.sdk=true;throw e}
  return id}

async function spLoadPlaylists(){
  try{const out=[{id:'liked',name:'Liked Songs',total:null}];let url='/me/playlists?limit=50';
    for(let i=0;i<10&&url;i++){const j=await sp('GET',url);
      (j.items||[]).forEach(p=>{if(p&&p.id)out.push({id:p.id,name:p.name||'Untitled playlist',total:(p.items&&p.items.total)!=null?p.items.total:(p.tracks&&p.tracks.total)!=null?p.tracks.total:null})});
      url=spPath(j.next)}
    S.sp.playlists=out;save();render()}
  catch(e){toast(spMsg(e))}}
async function spLoadTracks(pid){
  const byId=new Map(SPT.map(t=>[t.id,t]));SPT.forEach(t=>{t.pl=t.pl.filter(x=>x!==pid)});
  let url=pid==='liked'?'/me/tracks?limit=50':'/playlists/'+pid+'/items?limit=50',n=0;
  for(let i=0;i<40&&url;i++){const j=await sp('GET',url);
    for(const it of ((j&&j.items)||[])){const tr=it&&(it.item||it.track);
      if(!tr||tr.is_local||!/^spotify:track:/.test(tr.uri||''))continue;
      let t=byId.get(tr.uri);
      if(!t){t={id:tr.uri,sp:true,title:tr.name,artist:((tr.artists||[])[0]||{}).name||'',dur:tr.duration_ms||0,pl:[],plays:0,fav:false,stations:[]};byId.set(t.id,t);SPT.push(t)}
      if(!t.pl.includes(pid)){t.pl.push(pid);n++}}
    url=spPath(j&&j.next)}
  S.sp.loaded[pid]=n;return n}
function spAssign(){const src=S.sp.sources;
  SPT=SPT.filter(t=>t.pl.length);
  SPT.forEach(t=>{t.stations=Object.keys(src).filter(sid=>(src[sid]||[]).some(p=>t.pl.includes(p)))});

    toast(own?'Spotify only shares songs from playlists you own or collaborate on.':spMsg(e))}

/* DJ crate-digging: search Spotify for songs that fit a station and save them as a new playlist in the listener's account */
async function spCurate(sid){
  const st=station(sid),p=PERSONAS[st.persona]||PERSONAS.wave;
  if(!spMode()){toast('Connect Spotify in Music first.');return}
  const have=new Set(SPT.map(t=>t.id)),pool=ORR.poolFor(st,SPT);
  const genres=st.seek&&st.seek.length?st.seek:st.all?stations().flatMap(x=>x.seek||[]):[];
  const artists=[...new Set(pool.map(t=>t.artist).filter(Boolean))];
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  // Familiar stations lean on artists already in rotation; Explorer stations lean on the genre at large.
  const share={familiar:0.7,balanced:0.45,explorer:0.2}[st.discovery]||0.45;
  const nA=!artists.length?0:genres.length?Math.min(artists.length,Math.round(8*share)):Math.min(artists.length,8),nG=genres.length?Math.max(2,8-nA):0;
  const gs=shuffle(genres.slice());
  const qs=shuffle(artists.slice()).slice(0,nA).map(a=>({q:'artist:"'+a.replace(/"/g,'')+'"',off:0}))
    .concat(Array.from({length:nG},(_,i)=>({q:'genre:"'+gs[i%gs.length]+'"',plain:gs[i%gs.length],off:Math.floor(rand()*5)*10})));
  if(!qs.length){toast(st.name+' needs a few songs first, so '+p.name+' knows the sound. Give it a playlist in Music.');return}
  toast(p.name+' is digging through Spotify…');
  try{
    const found=[],seen=new Set();
    for(const x of qs){
      let j=await sp('GET','/search?type=track&limit=10&offset='+x.off+'&q='+encodeURIComponent(x.q));
      if(x.plain&&!((j&&j.tracks&&j.tracks.items)||[]).length)j=await sp('GET','/search?type=track&limit=10&q='+encodeURIComponent(x.plain));
      for(const tr of ((j&&j.tracks&&j.tracks.items)||[])){
        if(!tr||tr.is_local||!/^spotify:track:/.test(tr.uri||'')||have.has(tr.uri)||seen.has(tr.uri))continue;seen.add(tr.uri);
        found.push({id:tr.uri,sp:true,title:tr.name,artist:((tr.artists||[])[0]||{}).name||'',dur:tr.duration_ms||0,pl:[],plays:0,fav:false,stations:[]})}}
    const per={},picks=shuffle(found).filter(t=>{const a=t.artist.toLowerCase();per[a]=(per[a]||0)+1;return per[a]<=2}).slice(0,30);
    if(picks.length<5){toast('Spotify search came back nearly empty for '+st.name+'. Try again in a moment.');return}
    const name=st.name+' · '+p.name+'\'s picks · '+new Date().toLocaleDateString([], {month:'short',day:'numeric'});
    const pl=await sp('POST','/me/playlists',{name,description:'Picked for '+st.name+' by Open Road Radio.',public:false});
    if(!pl||!pl.id)throw new Error('no playlist came back');
    await sp('POST','/playlists/'+pl.id+'/items',{uris:picks.map(t=>t.id)});
    picks.forEach(t=>{t.pl=[pl.id];SPT.push(t)});
    S.sp.playlists.splice(1,0,{id:pl.id,name,total:picks.length});S.sp.loaded[pl.id]=picks.length;
    S.sp.sources[st.id]=(S.sp.sources[st.id]||[]).concat(pl.id);
    spAssign();log('dj',p.name+' built a playlist: '+name+' ('+picks.length+' songs)',st.id);render();
    openSheet(`<h2>${esc(p.name)}'s picks</h2><div class="s" style="color:var(--mute)">${picks.length} new songs saved to your Spotify as “${esc(name)}” and added to ${esc(st.name)}. <a href="https://open.spotify.com/playlist/${esc(pl.id)}">Open in Spotify</a></div>
      <div class="list" style="margin-top:12px">${picks.map(t=>`<div class="row"><div class="grow"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.artist)}</div></div></div>`).join('')}</div>
      <div class="btns" style="margin-top:14px"><button class="btn pri" data-act="close">Done</button></div>`)}
  catch(e){toast(e.status===403?'Spotify needs a new permission to create playlists. In Music, disconnect and connect again.':e.auth||e.status===429?spMsg(e):'Spotify would not build the playlist: '+e.message)}}

/* playback */
function spStop(){clearTimeout(spPollT);clearTimeout(spEdgeT);spBatch=[];spIdx=-1;spExt=null;spEdgeFor='';spStale=false;spBusy=false}
function stopAll(){const was=spMode()&&on;token++;cancelSpeech();on=false;try{au.pause()}catch(e){}nowItem=null;queue=[];prog=null;djText='';errMsg='';if(was)sp('PUT','/me/player/pause').catch(()=>{});spStop()}
function spBuild(){const st=cur(),pool=ORR.poolFor(st,SPT),out=[];if(!prog||prog.off)prog=ORR.newProg(st,rand);
  for(let i=0,n=Math.min(20,pool.length);i<n;i++){
    const pend=out.map(b=>({trackId:b.trackId,artist:(trackById(b.trackId)||{}).artist,at:Date.now()}));
    const pick=ORR.pickTrack(st,pool,S.recent.concat(pend),Date.now(),rand);if(!pick)break;
    out.push({trackId:pick.track.id,brk:ORR.djDue(prog,st,rand)})}
  return out}
function spUpNext(){const out=[];for(let k=Math.max(0,spIdx);k<spBatch.length&&out.length<4;k++){if(k>spIdx)out.push({type:'music',trackId:spBatch[k].trackId});if(spBatch[k].brk)out.push({type:'dj',kind:spBatch[k].brk})}return out}
async function spDevice(){if(S.sp.inpage)return spPlayerId();const j=await sp('GET','/me/player/devices');const d=((j&&j.devices)||[]).filter(x=>!x.is_restricted);
  return (d.find(x=>x.is_active)||d.find(x=>x.type==='Smartphone')||d[0]||{}).id||null}
function spEnter(i){spIdx=i;const t=trackById(spBatch[i].trackId);nowItem={type:'music',trackId:t.id};spExt=null;spEdgeFor='';spStale=false;
  S.recent.push({trackId:t.id,artist:t.artist,at:Date.now()});if(S.recent.length>300)S.recent.splice(0,S.recent.length-300);
  t.lastPlayed=Date.now();spState={prog:0,dur:t.dur,at:Date.now(),playing:true};
  log('music',t.title+(t.artist?' · '+t.artist:''));render()}
function spLeave(){const b=spBatch[spIdx];if(!b||spExt)return;const t=trackById(b.trackId);if(!t)return;const heard=spNow();
  if(heard>=30000||(t.dur&&heard>=t.dur*0.8))t.plays=(t.plays||0)+1;else log('skip','Skipped '+t.title);saveSp()}
async function spPlayBatch(b){
  b=b||spBuild();if(!b.length){stopWith(cur().name+' has no Spotify songs yet. In Music, tap a playlist and tick this station.');return false}
  const dev=await spDevice();if(!dev){spFail(SP_ASLEEP);return false}
  if(S.sp.inpage)await sp('PUT','/me/player',{device_ids:[dev],play:false}).catch(()=>{});
  await sp('PUT','/me/player/shuffle?state=false&device_id='+dev).catch(()=>{});
  await sp('PUT','/me/player/play?device_id='+dev,{uris:b.map(x=>x.trackId)});
  sp('PUT','/me/player/repeat?state=off&device_id='+dev).catch(()=>{});
  spCmdAt=Date.now();spBatch=b;spEnter(0);return true}
async function spStart(intro){
  unlock();spGesture();const my=++token,st=cur();errMsg='';djText='';clearTimeout(spEdgeT);
  if(!ORR.poolFor(st,SPT).length){spStop();nowItem=null;stopWith(st.name+' has no Spotify songs yet. In Music, tap a playlist and tick '+st.name+'.');return}
  on=true;prog=ORR.newProg(st,rand);spBusy=true;render();
  try{
    if(spBatch.length)await sp('PUT','/me/player/pause').catch(()=>{});
    if(intro){nowItem={type:'dj',kind:'intro'};spExt=null;await playDj({kind:'intro'},my);if(my!==token)return;djText=''}
    await spPlayBatch()}
  catch(e){if(my===token)spFail(spMsg(e))}
  finally{if(my===token){spBusy=false;if(on)spPollSoon(1500)}}}
function spPollSoon(ms){clearTimeout(spPollT);spPollT=setTimeout(spPoll,ms)}
async function spPoll(){
  if(!spMode()||!on)return;
  if(document.hidden||spBusy){spPollSoon(3000);return}
  try{
    const s=await sp('GET','/me/player');
    if(!on||spBusy)return spPollSoon(3000);
    const fresh=Date.now()-spCmdAt<5000;
    if(!s||!s.item){if(!fresh){spStale=true;spFail(S.sp.inpage?'Spotify stopped playing in this page. Press play to start again.':SP_ASLEEP)}else spPollSoon(2000);return}
    const uri=s.item.uri;let i=-1;
    for(let k=Math.max(0,spIdx);k<spBatch.length;k++)if(spBatch[k].trackId===uri){i=k;break}
    if(i<0)i=spBatch.findIndex(b=>b.trackId===uri);
    if(i<0){if(!spExt||spExt.uri!==uri){spLeave();spExt={uri,title:s.item.name,artist:(s.item.artists||[]).map(a=>a.name).join(', ')};nowItem={type:'ext'};spStale=true}}
    else if(i!==spIdx||spExt){spLeave();spEnter(i)}
    if(!s.is_playing&&!fresh){ // paused in the Spotify app, or the batch ran out while this page slept
      spState={prog:s.progress_ms||0,dur:s.item.duration_ms||0,at:Date.now(),playing:false};
      if(i<0||i>=spBatch.length-1&&(s.progress_ms||0)<2000)spStale=true;
      on=false;render();return}
    spState={prog:s.progress_ms||0,dur:s.item.duration_ms||0,at:Date.now(),playing:true};
    if(i>=0&&i===spIdx){const rem=spState.dur-spState.prog,need=spBatch[i].brk||spBatch.length-1-i<3;
      if(need&&rem<5200&&spEdgeFor!==uri){spEdgeFor=uri;clearTimeout(spEdgeT);spEdgeT=setTimeout(()=>spEdge(uri),Math.max(0,rem-1400))}}
    render();spPollSoon(3000)}
  catch(e){spFail(spMsg(e))}}
/* Runs just before a song ends: DJ break and/or a fresh batch of songs. Speech never overlaps Spotify audio. */
async function spEdge(uri){
  if(!on||document.hidden||spBusy||!spBatch[spIdx]||spBatch[spIdx].trackId!==uri)return;
  const b=spBatch[spIdx],low=spBatch.length-1-spIdx<3,doDj=!!b.brk&&Date.now()-lastDjAt>=60000,my=token;
  if(!doDj&&!low)return;
  spBusy=true;
  try{
    const nb=low?spBuild():null;
    if(doDj){
      await sp('PUT','/me/player/pause');
      spState={prog:spState.dur,dur:spState.dur,at:Date.now(),playing:false};spLeave();
      djNext=nb&&nb[0]?trackById(nb[0].trackId):null;
      nowItem={type:'dj',kind:b.brk};
      await playDj({kind:b.brk},my);djNext=null;
      if(my!==token)return;djText='';
      if(nb&&nb.length)await spPlayBatch(nb);
      else{await sp('POST','/me/player/next');await sp('PUT','/me/player/play').catch(()=>{});spCmdAt=Date.now();spEnter(spIdx+1)}}
    else if(nb&&nb.length){spState.prog=spState.dur;spLeave();await spPlayBatch(nb)}}
  catch(e){if(my===token)spFail(spMsg(e))}
  finally{djNext=null;if(my===token){spBusy=false;if(on)spPollSoon(1500)}}}
async function spToggle(){
  spGesture();
  if(on){const p=spNow();on=false;token++;cancelSpeech();djText='';spBusy=false;clearTimeout(spEdgeT);spState={prog:p,dur:spState.dur,at:Date.now(),playing:false};
    if(nowItem&&nowItem.type==='dj'){nowItem=null;spStale=true}
    render();try{await sp('PUT','/me/player/pause')}catch(e){}return}
  if(!spBatch.length||spStale||!nowItem||nowItem.type!=='music')return spStart(!spBatch.length);
  on=true;errMsg='';render();
  try{await sp('PUT','/me/player/play');spCmdAt=Date.now();spState.playing=true;spState.at=Date.now();spEdgeFor='';spPollSoon(1500)}
  catch(e){spStart(false)}}
async function spNext(){
  spGesture();
  if(!on||!spBatch.length||spStale||spIdx>=spBatch.length-1){if(spBatch.length&&!spExt)spLeave();return spStart(false)}
  token++;cancelSpeech();djText='';spBusy=false;clearTimeout(spEdgeT);
  try{await sp('POST','/me/player/next');await sp('PUT','/me/player/play').catch(()=>{});spCmdAt=Date.now();spPollSoon(700)}catch(e){spFail(spMsg(e))}}
async function spPrev(){
  if(!on||!spBatch.length)return;
  try{await sp('POST','/me/player/previous');spCmdAt=Date.now();spPollSoon(700)}catch(e){spFail(spMsg(e))}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&spMode()&&on)spPollSoon(200)});

function handleTag(uid,source){
  uid=String(uid||'').replace(/[^0-9a-f]/gi,'').toUpperCase();if(!uid)return;
  const card=S.cards.find(c=>c.uid===uid);
  if(!card){log('card',`Unknown card ${uid} scanned`);toast('Unknown card. Give it a job.');cardSheet({uid,label:'',target:curId},true);return}
  const st=station(card.target);
  if(card.action!=='play_station'||!st||!st.enabled){log('card',`${card.label}: target unavailable`);toast('That card points at a station that is off or gone.');cardSheet(card,false);return}

   <div class="note">${hasNfc?'This phone can read NFC. Tap Scan, then hold any NFC card or key tag to the phone. New tags ask what they should do.':'This browser cannot read NFC tags (iPhones and most in-app browsers cannot), so the cards here are virtual. Tap one to "scan" it. The mapping works the same way a real reader will.'}</div>
   <div class="btns" style="margin-top:12px">${hasNfc?'<button class="btn pri" data-act="scan">Scan a real card</button>':''}<button class="btn" data-act="simnew">Scan an unknown card</button></div>
   <h3>Registered cards</h3>
   <div class="list">${S.cards.map(c=>{const s=station(c.target);return `<div class="nfc" style="--c:${s?s.color:'#555'}"><div class="chip">NFC</div><div class="grow" style="flex:1;min-width:0"><div class="t" style="font-weight:600">${esc(c.label||'Unnamed card')}</div><div class="s" style="font-size:13px;color:var(--mute)">${esc(c.uid)} → ${s?esc(s.name):'missing station'}</div><div class="btns" style="margin-top:8px"><button class="btn sm pri" data-act="tap" data-id="${c.uid}">Tap card</button><button class="btn sm" data-act="editcard" data-id="${c.uid}">Edit</button></div></div></div>`}).join('')||'<div class="row dim"><div class="s">No cards registered.</div></div>'}</div>`;
}
function renderLog(){
  const lab={music:'SONG',dj:'DJ',card:'CARD',error:'ERROR',skip:'SKIP'};
  $('v-log').innerHTML=`<h2>Listening log</h2><div class="btns"><button class="btn sm" data-act="clearlog">Clear log</button></div><h3>Most recent first</h3>
   <div class="list">${S.log.slice(-120).reverse().map(e=>{const s=station(e.st),d=new Date(e.at);
    return `<div class="row"><div class="grow"><div class="t">${esc(e.text)}</div><div class="s">${d.toLocaleDateString([], {month:'short',day:'numeric'})} ${d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})} · ${s?esc(s.name):''}</div></div><span class="tagk"${e.kind==='error'?' style="color:var(--bad);border-color:var(--bad)"':''}>${lab[e.kind]||e.kind}</span></div>`}).join('')||'<div class="row dim"><div class="s">Nothing played yet.</div></div>'}</div>`;
}

/* ---------- sheets ---------- */
function openSheet(html){$('sheetbody').innerHTML=html;$('sheet').hidden=false}
function closeSheet(){$('sheet').hidden=true}
function trackSheet(id){const t=S.tracks.find(x=>x.id===id);if(!t)return;
  openSheet(`<h2>${esc(t.title)}</h2><div class="s" style="color:var(--mute)">${esc(t.artist||'Unknown artist')}${t.genre?' · '+esc(t.genre):''}</div>
   <h3>Plays on</h3><div class="s" style="color:var(--mute);font-size:13px">Leave all unticked to sort it automatically by genre tag.</div>
   ${stations().filter(s=>!s.all).map(s=>`<label class="chk"><input type="checkbox" data-st="${s.id}" id="ts-${s.id}" ${t.stations.includes(s.id)?'checked':''}> <span style="color:${s.color};font-weight:600">${esc(s.name)}</span></label>`).join('')}
   <label class="chk"><input type="checkbox" id="tfav" ${t.fav?'checked':''}> ★ Favorite (plays more on Familiar stations)</label>
   <div class="btns" style="margin-top:14px"><button class="btn pri" data-act="savetrack" data-id="${t.id}">Save</button><button class="btn danger" data-act="deltrack" data-id="${t.id}">Remove song</button><button class="btn" data-act="close">Cancel</button></div>`)}
function cardSheet(c,isNew){
  openSheet(`<h2>${isNew?'New card':'Edit card'}</h2><div class="s" style="font-family:var(--mono);color:var(--mute)">Tag ${esc(c.uid)}</div>
   <div class="fields"><label class="field">Card name<input id="clabel" value="${esc(c.label)}" placeholder="Road trip card"></label>
   <label class="field">When scanned, play<select id="ctarget">${live().map(s=>`<option value="${s.id}"${s.id===c.target?' selected':''}>${esc(s.name)}</option>`).join('')}</select></label></div>
   <div class="btns" style="margin-top:14px"><button class="btn pri" data-act="savecard" data-id="${c.uid}">Save card</button>${isNew?'':`<button class="btn danger" data-act="delcard" data-id="${c.uid}">Remove</button>`}<button class="btn" data-act="close">Cancel</button></div>`)}
function stationSheet(){
  openSheet(`<h2>New station</h2>
   <div class="fields"><label class="field">Name<input id="nsname" maxlength="28" placeholder="Sunday Drive"></label>
   <label class="field">One-line identity<input id="nstag" maxlength="60" placeholder="Slow songs for slow mornings."></label></div>
   <div class="fields"><label class="field">DJ personality<select id="nsper">${Object.entries(PERSONAS).map(([k,p])=>`<option value="${k}">${esc(p.name)} · ${esc(p.label)}</option>`).join('')}</select></label>
   <label class="field">Color<input type="color" id="nscol" value="#7fd1ff"></label></div>
   <div class="note">After saving, open Music and tick this station on the songs it should play. Until then it plays your unsorted songs.</div>
   <div class="btns" style="margin-top:14px"><button class="btn pri" data-act="savestation">Create station</button><button class="btn" data-act="close">Cancel</button></div>`)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');if(tab){showTab(tab.dataset.tab);return}
  if(e.target.id==='sheet'){closeSheet();return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(a==='toggle')toggle();
  else if(a==='next')next(); else if(a==='prev')prev();
  else if(a==='stnext')stepStation(1); else if(a==='stprev')stepStation(-1);
  else if(a==='tune')tune(id);
  else if(a==='fav'){const t=trackById(id);if(t){t.fav=!t.fav;save();render()}}
  else if(a==='track')trackSheet(id);
  else if(a==='savetrack'){const t=S.tracks.find(x=>x.id===id);t.stations=[...document.querySelectorAll('#sheetbody [data-st]')].filter(c=>c.checked).map(c=>c.dataset.st);t.fav=$('tfav').checked;save();closeSheet();if(on)refill(true);render()}
  else if(a==='deltrack'){S.tracks=S.tracks.filter(x=>x.id!==id);blobs.delete(id);idbDel(id);queue=queue.filter(q=>q.trackId!==id);save();closeSheet();render()}
  else if(a==='close')closeSheet();
  else if(a==='tap')handleTag(id,'virtual');
  else if(a==='simnew'){let u='04';for(let i=0;i<8;i++)u+='0123456789ABCDEF'[Math.floor(Math.random()*16)];handleTag(u,'virtual')}
  else if(a==='scan')scanNfc();
  else if(a==='editcard')cardSheet(S.cards.find(c=>c.uid===id),false);
  else if(a==='savecard'){const label=$('clabel').value.trim()||'Card '+id.slice(-4),target=$('ctarget').value;let c=S.cards.find(x=>x.uid===id);
    if(c){c.label=label;c.target=target}else S.cards.push({uid:id,label,action:'play_station',target});save();closeSheet();render();toast('Card saved')}
  else if(a==='delcard'){S.cards=S.cards.filter(c=>c.uid!==id);save();closeSheet();render()}
  else if(a==='clearlog'){S.log=[];save();renderLog()}
  else if(a==='src'){stopAll();S.settings.source=id;save();render()}
  else if(a==='spconnect'){S.sp.clientId=$('spcid').value.trim();save();if(!S.sp.clientId){toast('Paste your Spotify Client ID first.');return}spLogin()}
  else if(a==='spcopy'){try{navigator.clipboard.writeText(spRedirect()).then(()=>toast('Copied'),()=>toast('Select the address and copy it by hand.'))}catch(x){toast('Select the address and copy it by hand.')}}
  else if(a==='splists')spLoadPlaylists();
  else if(a==='spwhere'){stopAll();S.sp.inpage=id==='page';save();if(S.sp.inpage)spInitPlayer();else spKillPlayer();render()}
  else if(a==='spdisconnect'){stopAll();spKillPlayer();S.sp=Object.assign(S.sp,{token:'',refresh:'',exp:0,playlists:[],sources:{},loaded:{}});SPT=[];saveSp();S.settings.source='local';save();render();toast('Spotify disconnected')}
  else if(a==='spl')playlistSheet(id);
  else if(a==='savespl')savePlaylist(id);
  else if(a==='hear')previewVoice(id);
  else if(a==='curate')spCurate(id);
  else if(a==='newstation')stationSheet();
  else if(a==='savestation'){const name=$('nsname').value.trim();if(!name){toast('Give the station a name.');return}
    const used=stations().map(s=>s.freq),freq=FREE_FREQS.find(f=>!used.includes(f));if(!freq){toast('The dial is full. Delete a custom station first.');return}
    const sid='c-'+hash(name+Date.now());
    S.custom.push({id:sid,custom:true,name,freq,tagline:$('nstag').value.trim(),color:$('nscol').value,persona:$('nsper').value,genres:['\u0000'],discovery:'balanced',dj:'normal',motif:[440,554,659],rules:{artist_repeat_minutes:45,track_repeat_minutes:240}});
    save();closeSheet();render();toast(`${name} is on the dial at ${freq.toFixed(1)}`)}
  else if(a==='delstation'){S.custom=S.custom.filter(s=>s.id!==id);delete S.edits[id];S.tracks.forEach(t=>t.stations=t.stations.filter(x=>x!==id));if(curId===id){curId=live()[0].id;if(on)toggle()}save();render()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='file'){importFiles([...t.files]);t.value='';return}
  if(t.id==='voiceon'){S.settings.voice=t.checked;save();return}
  if(t.dataset.voice){if(t.value)S.voices[t.dataset.voice]=t.value;else delete S.voices[t.dataset.voice];save();previewVoice(t.dataset.voice);return}
  if(t.dataset.set){const id=t.dataset.id,k=t.dataset.set,st=station(id);
    if(k==='enabled'){if(t.value==='0'&&live().length<=1){toast('Keep at least one station on the dial.');render();return}edit(id,{enabled:t.value==='1'});if(t.value==='0'&&curId===id){if(on)toggle();curId=live()[0].id}}
    else if(k==='discovery')edit(id,{discovery:t.value});
    else if(k==='dj'){edit(id,{dj:t.value});if(id===curId&&prog){prog=ORR.newProg(station(id),rand);queue=queue.filter(q=>q.type==='music')}}
    else if(k==='artist')edit(id,{rules:Object.assign({},st.rules,{artist_repeat_minutes:+t.value})});
    else if(k==='track')edit(id,{rules:Object.assign({},st.rules,{track_repeat_minutes:+t.value})});
    render()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='vol'){S.settings.volume=+e.target.value;try{au.volume=S.settings.volume}catch(x){}try{spPlayer&&spPlayer.setVolume(S.settings.volume)}catch(x){}save()}
  if(e.target.id==='libq'){libFilter=e.target.value;renderLibrary();const q=$('libq');q.focus();q.setSelectionRange(q.value.length,q.value.length)}
});

/* ---------- boot ---------- */
(async function boot(){
  if(!station(curId)||!station(curId).enabled)curId=(live()[0]||stations()[0]).id;
  try{au.volume=0.5;volOk=Math.abs(au.volume-0.5)<0.01;au.volume=S.settings.volume}catch(e){volOk=false}
  $('vol').value=S.settings.volume;
  render();
  if(S.tracks.length){const keys=await idbKeys();const have=new Set(keys||[]);S.tracks.forEach(t=>{t.available=have.has(t.id)||blobs.has(t.id)});render()}
  try{if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{if($('v-stations').classList.contains('show'))renderStations()}}}catch(e){}
  loadClips();
  await spCallback();
  if(spMode()&&S.sp.inpage)spInitPlayer();
})();
</script>
</body>
</html>
